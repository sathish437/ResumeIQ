services:
  # -------------------------------------------------------------------
  # PostgreSQL Database Service (Local persistence with named volume)
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: resumeiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resumeiq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - resumeiq-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-resumeiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------
  # Spring Boot Backend Service (REST API, Spring AI, PDF/DOCX Parsing)
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resumeiq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection (defaults to internal container; override in .env for Neon DB)
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/resumeiq}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Google Gemini AI credentials
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-configured}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Google OAuth 2.0 Client ID for audience token verification
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-837596203973-dnhf7rp7qgpte6bbafunvshu2b0ghmui.apps.googleusercontent.com}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - resumeiq-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/api-docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------
  # React + Vite Frontend Service (Served via Nginx reverse proxy)
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-837596203973-dnhf7rp7qgpte6bbafunvshu2b0ghmui.apps.googleusercontent.com}
        VITE_API_BASE_URL: ""
    container_name: resumeiq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
      - "80:80"
    networks:
      - resumeiq-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# -------------------------------------------------------------------
# Dedicated bridge network for internal inter-service communication
# -------------------------------------------------------------------
networks:
  resumeiq-network:
    name: resumeiq-network
    driver: bridge

# -------------------------------------------------------------------
# Persistent storage volume for PostgreSQL data
# -------------------------------------------------------------------
volumes:
  postgres_data:
    name: resumeiq_postgres_data
