server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for production performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security & Cross-Origin Isolation headers for Google OAuth popups
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Support PDF/DOCX resume file uploads up to 25MB (matches Spring Boot max-request-size)
    client_max_body_size 25M;

    # Cache static assets immutably
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # Reverse proxy API requests to the Spring Boot backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # Connection keep-alive
        proxy_set_header Connection "";

        # Standard proxy forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Forward session cookies and authorization credentials
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;

        # Generous timeouts for AI LLM extraction, analysis, and chat memory
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SPA routing fallback (React Router / dynamic tabs)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
