# The Gemini starter is on the classpath from the project baseline. Tests that
# load the full application context must provide a value, but no test calls the
# Gemini API.
spring.ai.google.genai.api-key=test-key-not-used

# Tests use an in-memory database so no files are written to the project.
spring.datasource.url=jdbc:h2:mem:resumeiq-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
