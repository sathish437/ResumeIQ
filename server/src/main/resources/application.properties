spring.application.name=ResumeIQ
server.port=${PORT:8080}

# Google GenAI answers questions about uploaded resumes. The key is read from
# the environment so it never lands in source control. The placeholder keeps the
# application bootable when no key is configured; the ask endpoint then reports
# that AI answering is unavailable instead of failing at startup.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-configured}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}

# Neon PostgreSQL connection. Credentials and host are read from environment
# variables. The default URL is in the correct JDBC format for Neon.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-rapid-river-b33cn2dy-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always

# Robust connection pooling for serverless PostgreSQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Spring AI chat memory JDBC schema initialization
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Multipart upload limits. A request carries a single document, so the request
# limit is intentionally larger than the per-file limit.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Application-level guard used while validating each uploaded document.
app.upload.max-file-size=10MB

# Google OAuth Configuration
app.auth.google.client-id=${GOOGLE_CLIENT_ID:837596203973-dnhf7rp7qgpte6bbafunvshu2b0ghmui.apps.googleusercontent.com}

